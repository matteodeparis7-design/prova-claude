# Costruisce Promovo per Windows (Promovo.exe), lo prova davvero e lo pubblica da scaricare.
name: Promovo per Windows

on:
  push:
    branches: ["claude/**", "main"]
    paths: ["promovo/**", ".github/workflows/promovo-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scarica l'agente di scontorno (BiRefNet lite, MIT) da includere, con controllo dell'impronta
        working-directory: promovo
        run: |
          python -c "import sys; sys.path.insert(0, '.'); from pathlib import Path; from promovo import extras; e = extras.EXTRAS['cutout']; d = extras.BUNDLED / e.folder; d.mkdir(parents=True, exist_ok=True); extras._data_dir[:] = [Path('tmp_models')]; f = extras.download('cutout'); import shutil; [shutil.move(str(p), str(d / p.name)) for p in f.iterdir()]; print('incluso:', extras.path('cutout'))"

      - name: Segna la versione (per l'avviso «nuova versione disponibile»)
        working-directory: promovo
        run: |
          python -c "import json, os, datetime; json.dump({'commit': os.environ['GITHUB_SHA'], 'date': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}, open('promovo/build_info.json', 'w'))"

      - name: Installa Promovo e gli strumenti
        working-directory: promovo
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]" pyinstaller

      - name: Prepara la lettura ottica (i modelli vengono inclusi nel programma)
        working-directory: promovo
        run: python -c "from promovo.sample_flyer import build_sample_flyer, make_image_only; from promovo.modules.flyer.pdf import open_pdf; from promovo.modules.flyer import ocr; d = open_pdf(make_image_only(build_sample_flyer())); r = ocr.read_page(d[0], 1); print(len(r.offers), 'offerte lette'); assert len(r.offers) >= 5"

      - name: Prova dal vivo la mappa dei concorrenti e il meteo (Colleferro)
        working-directory: promovo
        continue-on-error: true
        run: python tools/check_nearby.py "Via Roma 1" Colleferro

      - name: Tutti i test, su Windows
        working-directory: promovo
        env:
          PROMOVO_WEATHER: "off"
        run: python -m pytest -q -p no:cacheprovider

      - name: Costruisci Promovo.exe
        working-directory: promovo/packaging
        run: pyinstaller promovo.spec --noconfirm --distpath ..\dist --workpath ..\build_pi

      - name: Avvia il programma e provalo (volantino, video, grafiche, Reel dal banco)
        shell: pwsh
        env:
          PROMOVO_WEATHER: "off"
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Resolve-Path "promovo\dist\Promovo\Promovo.exe"
          $proc = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput avvio.txt -RedirectStandardError errori.txt
          $base = "http://127.0.0.1:8000"
          $ok = $false
          for ($i = 0; $i -lt 120; $i++) {
            try { $h = Invoke-RestMethod "$base/api/health"; $ok = $true; break } catch { Start-Sleep -Seconds 2 }
          }
          if (-not $ok) { Get-Content avvio.txt; Get-Content errori.txt; throw "Promovo non si e' avviato" }
          $login = Invoke-RestMethod -Method Post "$base/api/auth/login" -ContentType "application/json" `
                   -Body '{"email":"demo@promovo.it","password":"promovo2026"}'
          $hd = @{ Authorization = "Bearer " + $login.token }
          $store = (Invoke-RestMethod "$base/api/stores" -Headers $hd)[0]
          $flyer = (Invoke-RestMethod "$base/api/stores/$($store.id)/flyers" -Headers $hd)[0]
          Write-Host "Negozio: $($store.name) - volantino con $($flyer.offer_count) offerte"
          $job = Invoke-RestMethod -Method Post "$base/api/flyers/$($flyer.id)/kit" -Headers $hd -ContentType "application/json" `
                 -Body '{"items":["texts","images","video_square"]}'
          for ($i = 0; $i -lt 300; $i++) {
            $j = Invoke-RestMethod "$base/api/jobs/$($job.id)" -Headers $hd
            if ($j.status -in @("done", "failed")) { break }
            Start-Sleep -Seconds 2
          }
          if ($j.status -ne "done" -or $j.result.errors.Count -gt 0) { $j | ConvertTo-Json -Depth 5; throw "Materiali non creati" }
          Write-Host "Materiali creati: $($j.result.done -join ', ')"
          # Reel dal banco: un video di prova fatto con l'ffmpeg incluso nel programma
          python -c "import imageio_ffmpeg,subprocess;subprocess.run([imageio_ffmpeg.get_ffmpeg_exe(),'-y','-v','error','-f','lavfi','-i','testsrc2=s=360x640:d=7:r=30','-f','lavfi','-t','7','-i','anoisesrc=r=48000','-shortest','-pix_fmt','yuv420p','-c:a','aac','banco.mp4'],check=True)"
          $full = Invoke-RestMethod "$base/api/flyers/$($flyer.id)" -Headers $hd
          $offer = $full.offers[0].id
          $resp = curl.exe -s -X POST "$base/api/stores/$($store.id)/clips" -H "Authorization: Bearer $($login.token)" `
                  -F "video=@banco.mp4;type=video/mp4" -F "offer_id=$offer" -F "voice_mode=none"
          $clip = $resp | ConvertFrom-Json
          for ($i = 0; $i -lt 300; $i++) {
            $c = Invoke-RestMethod "$base/api/jobs/$($clip.id)" -Headers $hd
            if ($c.status -in @("done", "failed")) { break }
            Start-Sleep -Seconds 2
          }
          if ($c.status -ne "done") { $c | ConvertTo-Json -Depth 5; throw "Reel dal banco non creato" }
          Write-Host "Reel dal banco creato: $($c.result.duration) secondi"
          # Pilota automatico su un volantino fatto solo di immagini: lettura ottica + tutti i materiali
          python -c "from promovo.sample_flyer import build_sample_flyer, make_image_only; open('volantino_foto.pdf','wb').write(make_image_only(build_sample_flyer()))"
          $up = curl.exe -s -X POST "$base/api/stores/$($store.id)/flyers" -H "Authorization: Bearer $($login.token)" `
                -F "file=@volantino_foto.pdf;type=application/pdf" -F "autopilot=true" | ConvertFrom-Json
          for ($i = 0; $i -lt 400; $i++) {
            $a = Invoke-RestMethod "$base/api/jobs/$($up.autopilot_job)" -Headers $hd
            if ($a.status -in @("done", "failed")) { break }
            Start-Sleep -Seconds 3
          }
          if ($a.status -ne "done" -or $a.result.offers -lt 8) { $a | ConvertTo-Json -Depth 5; throw "Pilota automatico non riuscito" }
          Write-Host "Pilota automatico: $($a.result.offers) offerte lette dall'immagine, materiali: $($a.result.done -join ', ')"
          $cfg = Invoke-RestMethod "$base/api/settings" -Headers $hd
          if (-not $cfg.agents.ocr) { throw "Lettura ottica non disponibile nel programma" }
          # Agenti aggiuntivi: lo scontorno e' incluso; i sottotitoli si scaricano (con controllo) e si provano davvero
          $ex = Invoke-RestMethod "$base/api/extras" -Headers $hd
          $cut = $ex | Where-Object { $_.key -eq "cutout" }
          if (-not ($cut.ready -and $cut.bundled)) { $ex | ConvertTo-Json; throw "Scontorno non incluso nel programma" }
          Invoke-RestMethod -Method Post "$base/api/extras/subtitles/download" -Headers $hd | Out-Null
          for ($i = 0; $i -lt 200; $i++) {
            $sub = (Invoke-RestMethod "$base/api/extras" -Headers $hd) | Where-Object { $_.key -eq "subtitles" }
            if ($sub.ready -or ($sub.error -and -not $sub.downloading)) { break }
            Start-Sleep -Seconds 3
          }
          if (-not $sub.ready) { $sub | ConvertTo-Json; throw "Agente dei sottotitoli non scaricato" }
          Write-Host "Sottotitoli automatici scaricati e verificati"
          python -c "import imageio_ffmpeg,subprocess;subprocess.run([imageio_ffmpeg.get_ffmpeg_exe(),'-y','-v','error','-f','lavfi','-i','sine=f=220:d=5','-ar','48000','voce.wav'],check=True)"
          $resp = curl.exe -s -X POST "$base/api/stores/$($store.id)/clips" -H "Authorization: Bearer $($login.token)" `
                  -F "video=@banco.mp4;type=video/mp4" -F "offer_id=$offer" -F "voice_mode=recorded" `
                  -F "voice=@voce.wav;type=audio/wav" -F "script=Buongiorno a tutti, oggi vi consiglio questo prodotto."
          $clip2 = $resp | ConvertFrom-Json
          for ($i = 0; $i -lt 300; $i++) {
            $c2 = Invoke-RestMethod "$base/api/jobs/$($clip2.id)" -Headers $hd
            if ($c2.status -in @("done", "failed")) { break }
            Start-Sleep -Seconds 2
          }
          if ($c2.status -ne "done") { $c2 | ConvertTo-Json -Depth 5; throw "Reel con voce non creato" }
          Write-Host "Reel con voce creato: sottotitoli $($c2.result.subtitles)"
          if (Select-String -Path avvio.txt,errori.txt -Pattern "trascrizione non riuscita" -Quiet) { Get-Content errori.txt -Tail 30; throw "L'agente dei sottotitoli non funziona nel programma" }
          Stop-Process -Id $proc.Id -Force
          Get-Content avvio.txt -TotalCount 20

      - name: Prepara il pacchetto da scaricare
        shell: pwsh
        run: |
          $dist = "promovo\dist\Promovo"
          Remove-Item -Recurse -Force "$dist\Dati Promovo" -ErrorAction SilentlyContinue
          Copy-Item "promovo\packaging\LEGGIMI.txt" "$dist\LEGGIMI.txt"
          Copy-Item "promovo\packaging\Avvia Promovo (se si chiude subito).bat" "$dist\"
          Copy-Item "promovo\GUIDA.md" "$dist\GUIDA.md"
          Compress-Archive -Path $dist -DestinationPath "Promovo_Windows.zip" -CompressionLevel Optimal
          "{0:N0} MB" -f ((Get-Item "Promovo_Windows.zip").Length / 1MB)

      - name: Crea l'installazione (Promovo_Setup.exe)
        working-directory: promovo/packaging
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc promovo.iss
          if ($LASTEXITCODE -ne 0) { throw "Installazione non creata" }
          Copy-Item "..\dist\Promovo_Setup.exe" "..\..\Promovo_Setup.exe"

      - name: Prova l'installazione come farebbe un utente
        shell: pwsh
        env:
          PROMOVO_WEATHER: "off"
        run: |
          $ErrorActionPreference = "Stop"
          Start-Process -FilePath ".\Promovo_Setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          $exe = Join-Path $env:LOCALAPPDATA "Programs\Promovo\Promovo.exe"
          if (-not (Test-Path $exe)) { throw "Promovo.exe non installato" }
          $proc = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru -RedirectStandardOutput inst.txt -RedirectStandardError inst_err.txt
          $ok = $false
          for ($i = 0; $i -lt 120; $i++) { try { Invoke-RestMethod "http://127.0.0.1:8000/api/health" | Out-Null; $ok = $true; break } catch { Start-Sleep -Seconds 2 } }
          Stop-Process -Id $proc.Id -Force
          if (-not $ok) { Get-Content inst.txt; Get-Content inst_err.txt; throw "Promovo installato non si avvia" }
          Write-Host "Promovo installato e avviato correttamente da $exe"

      - uses: actions/upload-artifact@v4
        with:
          name: Promovo_Windows
          path: |
            Promovo_Windows.zip
            Promovo_Setup.exe
          retention-days: 30

      - name: Pubblica da scaricare
        uses: softprops/action-gh-release@v2
        with:
          tag_name: promovo-beta
          target_commitish: ${{ github.sha }}
          name: "Promovo (beta per Windows)"
          prerelease: true
          files: |
            Promovo_Setup.exe
            Promovo_Windows.zip
          body: |
            **Consigliato: scarica Promovo_Setup.exe** e fai doppio clic: installa Promovo con l'icona sul Desktop.
            Se Windows dice "PC protetto da Windows": premi "Ulteriori informazioni" e poi "Esegui comunque".
            In alternativa: Promovo_Windows.zip, da ESTRARRE (tasto destro > Estrai tutto) prima di aprire Promovo.exe.
            Accesso di prova: demo@promovo.it / promovo2026. Istruzioni nel file LEGGIMI.txt.
            Questa versione è stata provata automaticamente su Windows prima della pubblicazione
            (test completi, avvio del programma, pilota automatico su un volantino fatto di immagini,
            video, grafiche e Reel dal banco).
