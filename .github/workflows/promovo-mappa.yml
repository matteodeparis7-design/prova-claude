# Prova dal vivo (con internet vero) della mappa dei concorrenti e del meteo: registro breve da leggere.
name: Promovo - prova mappa dal vivo

# Solo a mano (Actions > Run workflow): i server pubblici della mappa a volte non rispondono ai server di GitHub.
on:
  workflow_dispatch:

jobs:
  mappa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa Promovo
        working-directory: promovo
        run: pip install -q .
      - name: Colleferro, Via Roma 1
        working-directory: promovo
        run: python tools/check_nearby.py "Via Roma 1" Colleferro
      - name: Solo città (Frosinone)
        working-directory: promovo
        run: python tools/check_nearby.py "" Frosinone
