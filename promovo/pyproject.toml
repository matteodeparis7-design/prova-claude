[project]
name = "promovo"
version = "1.0.0"
description = "Promovo: gli agenti che trasformano il volantino del supermercato in contenuti pronti per i social"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.10",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "pydantic[email]>=2.6",
    "python-multipart>=0.0.9",
    "pypdfium2>=4.30",  # pagine dei PDF come immagine (Apache-2.0 / BSD-3)
    "pdfplumber>=0.11", # testo e posizione delle parole nei PDF (MIT)
    "reportlab>=4.0",   # scrittura dei PDF: report, rapporti, cartelli (BSD)
    "pillow>=10.0",
    "numpy>=1.26",
    "imageio-ffmpeg>=0.5",
    "tzdata>=2024.1",   # fusi orari su Windows, dove il sistema non li fornisce
    "segno>=1.5",       # QR code nella scena finale dei video
    "httpx>=0.27",      # chiamate al servizio della voce (ElevenLabs)
    "rapidocr==3.10.0", # lettura ottica dei volantini fatti di immagini (modelli PP-OCRv6, sul computer)
    "onnxruntime>=1.20",
    "faster-whisper==1.2.1",   # sottotitoli a tempo di parola (Whisper, licenza MIT; il modello si scarica a parte)
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["promovo*"]

[tool.setuptools.package-data]
promovo = ["assets/fonts/*.ttf", "assets/fonts/*.txt", "assets/models/*/*", "web/*.html", "web/assets/*", "build_info.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
